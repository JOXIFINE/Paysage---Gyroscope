<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Paysage Gyroscope 360°</title>

<style>
html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    touch-action:none;
}

#btn{
    position:fixed;
    top:20px;
    left:20px;
    z-index:999;
    padding:12px 18px;
    font-size:16px;
}

#scene{
    position:fixed;
    inset:0;
    overflow:hidden;
}

/* Couche géante pour limiter l'apparition des bords */
.layer{
    position:absolute;

    width:300%;
    height:300%;

    left:-100%;
    top:-100%;

    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;

    will-change:transform;
    transform:translateZ(0);
    backface-visibility:hidden;
}

/* Images locales */
#sky{
    background-image:url("sky.png");
    z-index:1;
}

#mountains{
    background-image:url("mountains.png");
    z-index:2;
    background-size: 100% auto;
      
}

#city{
    background-image:url("city.png");
    z-index:3;
    background-size: 100% auto;
}

#foreground{
    background-image:url("foreground.png");
    z-index:4;
}
</style>
</head>

<body>

<button id="btn">Activer le gyroscope</button>

<div id="scene">
    <div id="sky" class="layer"></div>
    <div id="mountains" class="layer"></div>
    <div id="city" class="layer"></div>
    <div id="foreground" class="layer"></div>
</div>

<script>

const btn = document.getElementById("btn");

const sky = document.getElementById("sky");
const mountains = document.getElementById("mountains");
const city = document.getElementById("city");
const foreground = document.getElementById("foreground");

let gyroEnabled = false;

// Inclinaison
let gx = 0;
let gy = 0;

// Rotation continue
let accumulatedAlpha = 0;
let lastAlpha = null;

// Valeurs lissées
let smoothGX = 0;
let smoothGY = 0;
let smoothAlpha = 0;

// Caméra
let camX = 0;
let camY = 0;

// Calibration
let baseGamma = null;
let baseBeta = null;

function handleOrientation(event){

    if(!gyroEnabled) return;

    const gamma = event.gamma ?? 0;
    const beta  = event.beta  ?? 0;
    const alpha = event.alpha ?? 0;

    if(baseGamma === null){
        baseGamma = gamma;
        baseBeta = beta;
    }

    gx = gamma - baseGamma;
    gy = beta - baseBeta;

    // Gestion rotation continue alpha
    if(lastAlpha !== null){

        let delta = alpha - lastAlpha;

        if(delta > 180) delta -= 360;
        if(delta < -180) delta += 360;

        accumulatedAlpha += delta;
    }

    lastAlpha = alpha;
}

async function enableGyro(){

    try{

        if(
            typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function"
        ){

            const permission =
                await DeviceOrientationEvent.requestPermission();

            if(permission !== "granted"){
                return;
            }
        }

        gyroEnabled = true;

        window.addEventListener(
            "deviceorientation",
            handleOrientation,
            true
        );

        btn.style.display = "none";

    }
    catch(err){
        console.error(err);
    }
}

btn.addEventListener("click", enableGyro);

function animate(){

    // Lissage
    smoothGX += (gx - smoothGX) * 0.15;
    smoothGY += (gy - smoothGY) * 0.15;

    smoothAlpha +=
        (accumulatedAlpha - smoothAlpha) * 0.08;

    // Sensibilité inclinaison
    const tiltX = smoothGX * 12;
    const tiltY = smoothGY * 10;

    // Sensibilité rotation complète
    const turnX = smoothAlpha * 8;

    const targetX = turnX + tiltX;
    const targetY = tiltY;

    camX += (targetX - camX) * 0.12;
    camY += (targetY - camY) * 0.12;

    sky.style.transform =
        `translate3d(${camX * 0.15}px, ${camY * 0.15}px, 0)`;

    mountains.style.transform =
        `translate3d(${camX * 0.35}px, ${camY * 0.35}px, 0)`;

    city.style.transform =
        `translate3d(${camX * 0.65}px, ${camY * 0.65}px, 0)`;

    foreground.style.transform =
        `translate3d(${camX}px, ${camY}px, 0)`;

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
