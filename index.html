<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Paysage Gyroscope</title>

<style>
body {
  margin: 0;
  overflow: auto; /* IMPORTANT → autorise le scroll */
  height: 200vh; /* permet de scroller */
}

/* Couches */
.layer {
  position: fixed; /* reste à l'écran */
  width: 200%;
  height: 200%;
  background-size: cover;
  background-repeat: no-repeat;
  transition: transform 0.05s ease-out;
}

#sky { background-image: url('sky.png'); z-index: 1; }
#mountains { background-image: url('mountains.png'); top: 30%; z-index: 2; }
#foreground { background-image: url('foreground.png'); top: 60%; z-index: 3; }

/* Bouton */
#startBtn {
  position: fixed;
  bottom: 20px;
  left: 20px;
  padding: 10px 14px;
  background: black;
  color: white;
  border: none;
  font-size: 14px;
  cursor: pointer;
  z-index: 10;
  border-radius: 6px;
}
</style>
</head>

<body>

<button id="startBtn">Activer le gyroscope</button>

<div id="sky" class="layer"></div>
<div id="mountains" class="layer"></div>
<div id="foreground" class="layer"></div>

<script>
const sky = document.getElementById("sky");
const mountains = document.getElementById("mountains");
const foreground = document.getElementById("foreground");
const button = document.getElementById("startBtn");

let gyroX = 0, gyroY = 0;
let smoothX = 0, smoothY = 0;

function updateScene() {
  const scrollY = window.scrollY;

  // Combinaison scroll + gyroscope
  const x = gyroX;
  const y = gyroY + scrollY * 0.2;

  // Lissage
  smoothX += (x - smoothX) * 0.1;
  smoothY += (y - smoothY) * 0.1;

  sky.style.transform = `translate(${smoothX * 1}px, ${smoothY * 1}px)`;
  mountains.style.transform = `translate(${smoothX * 3}px, ${smoothY * 2}px)`;
  foreground.style.transform = `translate(${smoothX * 6}px, ${smoothY * 4}px)`;

  requestAnimationFrame(updateScene);
}

function handleOrientation(event) {
  gyroX = event.gamma;
  gyroY = event.beta;
}

function enableGyro() {
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
    DeviceOrientationEvent.requestPermission()
      .then(response => {
        if (response === "granted") {
          window.addEventListener("deviceorientation", handleOrientation);
          button.style.display = "none";
        }
      });
  } else {
    window.addEventListener("deviceorientation", handleOrientation);
    button.style.display = "none";
  }
}

button.addEventListener("click", enableGyro);

// Lance l’animation en continu
updateScene();
</script>

</body>
</html>
