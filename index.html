<script>
const sky = document.getElementById("sky");
const mountains = document.getElementById("mountains");
const foreground = document.getElementById("foreground");
const city = document.getElementById("city");
const btn = document.getElementById("btn");

// position caméra
let camX = 0;
let camY = 0;

// gyroscope brut
let gyroX = 0;
let gyroY = 0;

// calibration (important pour éviter les sauts)
let baseGX = null;
let baseGY = null;

// valeurs lissées
let smoothGX = 0;
let smoothGY = 0;

// ---------------- GYRO ----------------
function handleOrientation(e) {
  let x = e.gamma || 0;
  let y = e.beta || 0;

  // calibration initiale
  if (baseGX === null) {
    baseGX = x;
    baseGY = y;
  }

  // valeurs relatives (clé du comportement continu)
  gyroX = x - baseGX;
  gyroY = y - baseGY;
}

function enableGyro() {
  if (typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function") {

    DeviceOrientationEvent.requestPermission()
      .then(res => {
        if (res === "granted") {
          window.addEventListener("deviceorientation", handleOrientation, true);
          btn.style.display = "none";
        }
      });

  } else {
    window.addEventListener("deviceorientation", handleOrientation, true);
    btn.style.display = "none";
  }
}

btn.addEventListener("click", enableGyro);

// ---------------- BLOQUER SCROLL / ZOOM ----------------
document.body.addEventListener("touchmove", (e) => {
  e.preventDefault();
}, { passive: false });

// ---------------- RENDER LOOP ----------------
function update() {

  // lissage
  smoothGX += (gyroX - smoothGX) * 0.08;
  smoothGY += (gyroY - smoothGY) * 0.08;

  // gyro → mouvement continu (sans "reset" quand on tourne le téléphone)
  camX += smoothGX * 0.02;
  camY += smoothGY * 0.02;

  const baseX = camX;
  const baseY = camY;

  sky.style.transform =
    `translate3d(${baseX * 0.2}px, ${baseY * 0.2}px, 0) scale(1)`;

  mountains.style.transform =
    `translate3d(${baseX * 0.5}px, ${baseY * 0.5}px, 0) scale(1)`;

  city.style.transform =
    `translate3d(${baseX * 0.7}px, ${baseY * 0.7}px, 0) scale(1)`;

  foreground.style.transform =
    `translate3d(${baseX * 1}px, ${baseY * 1}px, 0) scale(1)`;

  requestAnimationFrame(update);
}

update();
</script>
