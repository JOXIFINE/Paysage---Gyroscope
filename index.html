<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Paysage fluide gyroscope</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  height: 100%;
  background: black;
}

#btn {
  position: fixed;
  z-index: 10;
  top: 20px;
  left: 20px;
  padding: 10px 15px;
}

#scene {
  position: absolute;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

.layer {
  position: absolute;
  width: 120%;
  height: 120%;
  left: -10%;
  top: -10%;
  background-size: cover;
  background-position: center;
  will-change: transform;
}

/* 👉 MET DES IMAGES ICI */
#sky {
  background-image: url("sky.png");
  z-index: 1;
}

#mountains {
  background-image: url("mountains.png");
  z-index: 2;
}

#city {
  background-image: url("city.png");
  z-index: 3;
}

#foreground {
  background-image: url("foreground.png");
  z-index: 4;
}
</style>
</head>

<body>

<button id="btn">Activer gyroscope</button>

<div id="scene">
  <div id="sky" class="layer"></div>
  <div id="mountains" class="layer"></div>
  <div id="city" class="layer"></div>
  <div id="foreground" class="layer"></div>
</div>

<script>
const btn = document.getElementById("btn");

const layers = {
  sky: document.getElementById("sky"),
  mountains: document.getElementById("mountains"),
  city: document.getElementById("city"),
  foreground: document.getElementById("foreground")
};

// position caméra (lissée)
let camX = 0;
let camY = 0;

// gyro brut
let gx = 0;
let gy = 0;

// gyro lissé
let sgx = 0;
let sgy = 0;

// calibration
let baseX = null;
let baseY = null;

let gyroEnabled = false;

// ---------------- GYRO ----------------
function onOrientation(e) {
  if (!gyroEnabled) return;

  const x = e.gamma ?? 0;
  const y = e.beta ?? 0;

  if (baseX === null) {
    baseX = x;
    baseY = y;
  }

  gx = x - baseX;
  gy = y - baseY;
}

async function enableGyro() {
  try {
    if (typeof DeviceOrientationEvent.requestPermission === "function") {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res !== "granted") return;
    }

    gyroEnabled = true;
    window.addEventListener("deviceorientation", onOrientation, true);
    btn.style.display = "none";

  } catch (e) {
    console.log(e);
  }
}

btn.addEventListener("click", enableGyro);

// ---------------- LOOP FLUIDE ----------------
function animate() {

  // 🔥 SMOOTH GYRO (très important)
  sgx += (gx - sgx) * 0.08;
  sgy += (gy - sgy) * 0.08;

  // 🔥 inertie caméra
  camX += sgx * 0.02;
  camY += sgy * 0.02;

  // parallax doux
  layers.sky.style.transform =
    `translate3d(${camX * 0.2}px, ${camY * 0.2}px, 0)`;

  layers.mountains.style.transform =
    `translate3d(${camX * 0.4}px, ${camY * 0.4}px, 0)`;

  layers.city.style.transform =
    `translate3d(${camX * 0.7}px, ${camY * 0.7}px, 0)`;

  layers.foreground.style.transform =
    `translate3d(${camX}px, ${camY}px, 0)`;

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
