<script>
const sky = document.getElementById("sky");
const mountains = document.getElementById("mountains");
const foreground = document.getElementById("foreground");
const city = document.getElementById("city");
const btn = document.getElementById("btn");

let camX = 0;
let camY = 0;

let gyroX = 0;
let gyroY = 0;

let smoothGX = 0;
let smoothGY = 0;

let gyroEnabled = false;

// calibration
let baseGX = null;
let baseGY = null;

// ---------------- GYRO ----------------
function handleOrientation(e) {
  if (!gyroEnabled) return;

  const x = typeof e.gamma === "number" ? e.gamma : 0;
  const y = typeof e.beta === "number" ? e.beta : 0;

  if (baseGX === null || baseGY === null) {
    baseGX = x;
    baseGY = y;
  }

  gyroX = x - baseGX;
  gyroY = y - baseGY;
}

async function enableGyro() {
  try {
    // iOS permission
    if (
      typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function"
    ) {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res !== "granted") return;
    }

    gyroEnabled = true;

    window.addEventListener("deviceorientation", handleOrientation, true);
    btn.style.display = "none";

  } catch (err) {
    console.log("Gyro not available or denied", err);
  }
}

btn.addEventListener("click", enableGyro);

// ---------------- SAFE TOUCH (optionnel, léger) ----------------
// On NE bloque PAS le scroll global pour éviter écran cassé
let isDragging = false;
let lastX = 0;
let lastY = 0;

window.addEventListener("touchstart", (e) => {
  if (e.touches.length === 1) {
    isDragging = true;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  }
});

window.addEventListener("touchmove", (e) => {
  if (!isDragging || e.touches.length !== 1) return;

  const dx = e.touches[0].clientX - lastX;
  const dy = e.touches[0].clientY - lastY;

  camX += dx;
  camY += dy;

  lastX = e.touches[0].clientX;
  lastY = e.touches[0].clientY;
});

window.addEventListener("touchend", () => {
  isDragging = false;
});

// ---------------- LOOP ----------------
function update() {

  // gyro lissé
  smoothGX += (gyroX - smoothGX) * 0.08;
  smoothGY += (gyroY - smoothGY) * 0.08;

  // mouvement combiné (gyro + drag)
  camX += smoothGX * 0.02;
  camY += smoothGY * 0.02;

  const x = camX;
  const y = camY;

  sky.style.transform =
    `translate3d(${x * 0.2}px, ${y * 0.2}px, 0) scale(1)`;

  mountains.style.transform =
    `translate3d(${x * 0.5}px, ${y * 0.5}px, 0) scale(1)`;

  city.style.transform =
    `translate3d(${x * 0.7}px, ${y * 0.7}px, 0) scale(1)`;

  foreground.style.transform =
    `translate3d(${x}px, ${y}px, 0) scale(1)`;

  requestAnimationFrame(update);
}

update();
</script>
