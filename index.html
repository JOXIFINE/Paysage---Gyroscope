<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Paysage interactif</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #95BCCB;
  touch-action: none;
}

/* scène globale */
#scene {
  position: absolute;
  width: 3000px;
  height: 2000px;
  transform-origin: 0 0;
}

/* couches */
.layer {
  position: absolute;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-repeat: no-repeat;
}

#sky { background-image: url('sky.png'); z-index: 1; }
#mountains { background-image: url('mountains.png'); z-index: 2; }
#foreground { background-image: url('foreground.png'); z-index: 3; }

/* bouton */
#btn {
  position: fixed;
  bottom: 20px;
  left: 20px;
  background: black;
  color: white;
  padding: 10px;
  border: none;
  z-index: 10;
}
</style>
</head>

<body>

<button id="btn">Activer</button>

<div id="scene">
  <div id="sky" class="layer"></div>
  <div id="mountains" class="layer"></div>
  <div id="foreground" class="layer"></div>
</div>

<script>
const scene = document.getElementById("scene");
const btn = document.getElementById("btn");

let camX = 0;
let camY = 0;
let zoom = 1;

let gyroX = 0;
let gyroY = 0;

// ---------------- GYROSCOPE ----------------
function handleOrientation(e) {
  gyroX = e.gamma || 0;
  gyroY = e.beta || 0;
}

function enableGyro() {
  if (typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function") {
    DeviceOrientationEvent.requestPermission()
      .then(res => {
        if (res === "granted") {
          window.addEventListener("deviceorientation", handleOrientation);
          btn.style.display = "none";
        }
      });
  } else {
    window.addEventListener("deviceorientation", handleOrientation);
    btn.style.display = "none";
  }
}

btn.addEventListener("click", enableGyro);

// ---------------- DRAG ----------------
let isDragging = false;
let lastX = 0;
let lastY = 0;

window.addEventListener("touchstart", (e) => {
  if (e.touches.length === 1) {
    isDragging = true;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  }
});

window.addEventListener("touchmove", (e) => {
  if (e.touches.length === 1 && isDragging) {
    let dx = e.touches[0].clientX - lastX;
    let dy = e.touches[0].clientY - lastY;

    camX += dx;
    camY += dy;

    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  }

  // PINCH ZOOM
  if (e.touches.length === 2) {
    let dx = e.touches[0].clientX - e.touches[1].clientX;
    let dy = e.touches[0].clientY - e.touches[1].clientY;
    let dist = Math.sqrt(dx*dx + dy*dy);

    if (window.lastDist) {
      zoom += (dist - window.lastDist) * 0.005;
      zoom = Math.max(0.5, Math.min(3, zoom));
    }
    window.lastDist = dist;
  }
});

window.addEventListener("touchend", () => {
  isDragging = false;
  window.lastDist = null;
});

// ---------------- RENDER ----------------
function update() {
  const finalX = camX + gyroX * 5;
  const finalY = camY + gyroY * 5;

  scene.style.transform = `
    translate(${finalX}px, ${finalY}px)
    scale(${zoom})
  `;

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
