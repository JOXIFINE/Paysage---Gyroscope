<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Paysage Gyroscope</title>
<style>
body {
  margin: 0;
  overflow: hidden;
  background: #87CEEB;
  font-family: sans-serif;
}

.layer {
  position: absolute;
  width: 200%;
  height: 200%;
  background-size: cover;
  background-repeat: no-repeat;
  transition: transform 0.05s ease-out; /* Lissage mouvement */
}

#sky { background-image: url('sky.png'); z-index: 1; }
#mountains { background-image: url('mountains.png'); top: 30%; z-index: 2; }
#foreground { background-image: url('foreground.png'); top: 60%; z-index: 3; }

#message {
  position: fixed;
  top: 20px;
  left: 20px;
  background: rgba(255,255,255,0.9);
  padding: 10px;
  border: 1px solid black;
  z-index: 10;
}
</style>
</head>
<body>

<div id="message">Autorisez le gyroscope pour que le paysage bouge.</div>

<div id="sky" class="layer"></div>
<div id="mountains" class="layer"></div>
<div id="foreground" class="layer"></div>

<script>
const sky = document.getElementById("sky");
const mountains = document.getElementById("mountains");
const foreground = document.getElementById("foreground");
const message = document.getElementById("message");

let lastX = 0, lastY = 0;

function handleOrientation(event) {
  const x = event.gamma;
  const y = event.beta;

  // Lissage du mouvement
  lastX += (x - lastX) * 0.1;
  lastY += (y - lastY) * 0.1;

  sky.style.transform = `translate(${lastX * 1}px, ${lastY * 1}px)`;
  mountains.style.transform = `translate(${lastX * 3}px, ${lastY * 2}px)`;
  foreground.style.transform = `translate(${lastX * 6}px, ${lastY * 4}px)`;
}

// Fonction pour activer le gyroscope
function enableGyro() {
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
    DeviceOrientationEvent.requestPermission()
      .then(response => {
        if (response === "granted") {
          window.addEventListener("deviceorientation", handleOrientation);
          message.style.display = "none";
        } else {
          message.innerText = "Permission refusée. Impossible d’utiliser le gyroscope.";
        }
      })
      .catch(err => {
        message.innerText = "Erreur : " + err;
      });
  } else {
    // Android ou navigateur non iOS
    window.addEventListener("deviceorientation", handleOrientation);
    message.style.display = "none";
  }
}

// Demande de permission immédiatement après le chargement
window.addEventListener("load", () => {
  // iOS 13+ nécessite un clic, donc on simule un petit clic automatique avec un prompt
  enableGyro();
});
</script>

</body>
</html>
