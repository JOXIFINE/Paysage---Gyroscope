<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Paysage interactif</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<button id="btn">Activer</button>

<div id="scene">
  <div id="sky" class="layer"></div>
  <div id="mountains" class="layer"></div>
  <div id="foreground" class="layer"></div>
</div>

<script>
  const sky = document.getElementById("sky");
const mountains = document.getElementById("mountains");
const foreground = document.getElementById("foreground");
const scene = document.getElementById("scene");
const btn = document.getElementById("btn");

let camX = 0;
let camY = 0;
let zoom = 1;

// Gyro valeurs brutes
let gyroX = 0;
let gyroY = 0;

// Gyro lissé
let smoothGX = 0;
let smoothGY = 0;

// ---------------- GYROSCOPE ----------------
function handleOrientation(e) {
  gyroX = e.gamma || 0;
  gyroY = e.beta || 0;
}

function enableGyro() {
  if (typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function") {
    DeviceOrientationEvent.requestPermission()
      .then(res => {
        if (res === "granted") {
          window.addEventListener("deviceorientation", handleOrientation);
          btn.style.display = "none";
        }
      });
  } else {
    window.addEventListener("deviceorientation", handleOrientation);
    btn.style.display = "none";
  }
}

btn.addEventListener("click", enableGyro);

// ---------------- DRAG ----------------
let isDragging = false;
let lastX = 0;
let lastY = 0;

window.addEventListener("touchstart", (e) => {
  if (e.touches.length === 1) {
    isDragging = true;
    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  }
});

window.addEventListener("touchmove", (e) => {
  if (e.touches.length === 1 && isDragging) {
    let dx = e.touches[0].clientX - lastX;
    let dy = e.touches[0].clientY - lastY;

    camX += dx;
    camY += dy;

    lastX = e.touches[0].clientX;
    lastY = e.touches[0].clientY;
  }

  // PINCH ZOOM
  if (e.touches.length === 2) {
    let dx = e.touches[0].clientX - e.touches[1].clientX;
    let dy = e.touches[0].clientY - e.touches[1].clientY;
    let dist = Math.sqrt(dx*dx + dy*dy);

    if (window.lastDist) {
      zoom += (dist - window.lastDist) * 0.003;
      zoom = Math.max(0.5, Math.min(2, zoom));
    }
    window.lastDist = dist;
  }
});

window.addEventListener("touchend", () => {
  isDragging = false;
  window.lastDist = null;
});

// ---------------- RENDER LOOP ----------------
function update() {

  // LISSAGE GYRO
  smoothGX += (gyroX - smoothGX) * 0.08;
  smoothGY += (gyroY - smoothGY) * 0.08;

  const baseX = camX + smoothGX * 5;
  const baseY = camY + smoothGY * 5;

  // PARALLAXE
  sky.style.transform = `
    translate3d(${baseX * 0.2}px, ${baseY * 0.2}px, 0)
    scale(${zoom})
  `;

  mountains.style.transform = `
    translate3d(${baseX * 0.5}px, ${baseY * 0.5}px, 0)
    scale(${zoom})
  `;

  foreground.style.transform = `
    translate3d(${baseX * 1}px, ${baseY * 1}px, 0)
    scale(${zoom})
  `;

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
