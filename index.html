<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Paysage gyroscope</title>

<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    height: 100%;
    background: #000;
  }

  #btn {
    position: fixed;
    z-index: 10;
    top: 20px;
    left: 20px;
    padding: 10px 15px;
    font-size: 16px;
  }

  #scene {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  .layer {
    position: absolute;
    width: 120%;
    height: 120%;
    left: -10%;
    top: -10%;
    will-change: transform;
  }

  #sky {
    background: linear-gradient(#4aa3ff, #cceeff);
    z-index: 1;
  }

  #mountains {
    background: linear-gradient(#3a6b3a, #1f3d1f);
    z-index: 2;
  }

  #city {
    background: linear-gradient(#555, #222);
    z-index: 3;
  }

  #foreground {
    background: linear-gradient(#2b2b2b, #000);
    z-index: 4;
  }
</style>
</head>

<body>

<button id="btn">Activer gyroscope</button>

<div id="scene">
  <div id="sky" class="layer"></div>
  <div id="mountains" class="layer"></div>
  <div id="city" class="layer"></div>
  <div id="foreground" class="layer"></div>
</div>

<script>
const btn = document.getElementById("btn");
const sky = document.getElementById("sky");
const mountains = document.getElementById("mountains");
const city = document.getElementById("city");
const foreground = document.getElementById("foreground");

// caméra
let camX = 0;
let camY = 0;

// gyroscope
let gyroEnabled = false;
let gx = 0;
let gy = 0;
let baseX = null;
let baseY = null;

// ---------------- GYRO ----------------
function onOrientation(e) {
  if (!gyroEnabled) return;

  const x = e.gamma ?? 0;
  const y = e.beta ?? 0;

  if (baseX === null) {
    baseX = x;
    baseY = y;
  }

  gx = x - baseX;
  gy = y - baseY;
}

async function enableGyro() {
  try {
    if (
      typeof DeviceOrientationEvent !== "undefined" &&
      typeof DeviceOrientationEvent.requestPermission === "function"
    ) {
      const res = await DeviceOrientationEvent.requestPermission();
      if (res !== "granted") return;
    }

    gyroEnabled = true;
    window.addEventListener("deviceorientation", onOrientation, true);
    btn.style.display = "none";

  } catch (err) {
    console.log("Gyroscope error:", err);
  }
}

btn.addEventListener("click", enableGyro);

// ---------------- LOOP ----------------
function update() {

  // inertie simple
  camX += gx * 0.03;
  camY += gy * 0.03;

  sky.style.transform = `translate3d(${camX * 0.2}px, ${camY * 0.2}px, 0)`;
  mountains.style.transform = `translate3d(${camX * 0.5}px, ${camY * 0.5}px, 0)`;
  city.style.transform = `translate3d(${camX * 0.8}px, ${camY * 0.8}px, 0)`;
  foreground.style.transform = `translate3d(${camX}px, ${camY}px, 0)`;

  requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
