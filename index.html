<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Paysage Gyroscope</title>

<style>
html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    touch-action:none;
}

#btn{
    position:fixed;
    top:20px;
    left:20px;
    z-index:999;
    padding:12px 18px;
    font-size:16px;
}

#scene{
    position:fixed;
    inset:0;
    overflow:hidden;
}

/* Très grandes couches pour éviter les bords */
.layer{
    position:absolute;

    width:220%;
    height:220%;

    left:-60%;
    top:-60%;

    background-position:center;
    background-size:cover;
    background-repeat:no-repeat;

    will-change:transform;
    transform:translateZ(0);
    backface-visibility:hidden;
}

/* Remplace par tes images locales */
#sky{
    background-image:url("sky.jpg");
    z-index:1;
}

#mountains{
    background-image:url("mountains.png");
    z-index:2;
}

#city{
    background-image:url("city.png");
    z-index:3;
}

#foreground{
    background-image:url("foreground.png");
    z-index:4;
}
</style>
</head>

<body>

<button id="btn">Activer le gyroscope</button>

<div id="scene">
    <div id="sky" class="layer"></div>
    <div id="mountains" class="layer"></div>
    <div id="city" class="layer"></div>
    <div id="foreground" class="layer"></div>
</div>

<script>

const btn = document.getElementById("btn");

const sky = document.getElementById("sky");
const mountains = document.getElementById("mountains");
const city = document.getElementById("city");
const foreground = document.getElementById("foreground");

let gyroEnabled = false;

// gyro brut
let gx = 0;
let gy = 0;

// gyro lissé
let smoothGX = 0;
let smoothGY = 0;

// position caméra
let camX = 0;
let camY = 0;

// calibration
let baseGamma = null;
let baseBeta = null;

function handleOrientation(event){

    if(!gyroEnabled) return;

    const gamma = event.gamma ?? 0;
    const beta = event.beta ?? 0;

    if(baseGamma === null){
        baseGamma = gamma;
        baseBeta = beta;
    }

    gx = gamma - baseGamma;
    gy = beta - baseBeta;
}

async function enableGyro(){

    try{

        if(
            typeof DeviceOrientationEvent !== "undefined" &&
            typeof DeviceOrientationEvent.requestPermission === "function"
        ){

            const permission =
                await DeviceOrientationEvent.requestPermission();

            if(permission !== "granted"){
                return;
            }
        }

        gyroEnabled = true;

        window.addEventListener(
            "deviceorientation",
            handleOrientation,
            true
        );

        btn.style.display = "none";

    }catch(err){
        console.error(err);
    }
}

btn.addEventListener("click", enableGyro);

function animate(){

    // Lissage gyro plus rapide
    smoothGX += (gx - smoothGX) * 0.15;
    smoothGY += (gy - smoothGY) * 0.15;

    // Déplacement maximum
    const maxMove = 800;

    const targetX = (smoothGX / 45) * maxMove;
    const targetY = (smoothGY / 45) * maxMove;

    // Inertie caméra
    camX += (targetX - camX) * 0.12;
    camY += (targetY - camY) * 0.12;

    sky.style.transform =
        `translate3d(${camX * 0.15}px, ${camY * 0.15}px, 0)`;

    mountains.style.transform =
        `translate3d(${camX * 0.35}px, ${camY * 0.35}px, 0)`;

    city.style.transform =
        `translate3d(${camX * 0.65}px, ${camY * 0.65}px, 0)`;

    foreground.style.transform =
        `translate3d(${camX}px, ${camY}px, 0)`;

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
