<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Paysage Gyroscope</title>

<style>
body {
  margin: 0;
  overflow: hidden;
}

/* Couches du paysage */
.layer {
  position: absolute;
  width: 200%;
  height: 200%;
  background-size: cover;
  background-repeat: no-repeat;
  transition: transform 0.05s ease-out;
}

#sky { background-image: url('sky.png'); z-index: 1; }
#mountains { background-image: url('mountains.png'); top: 30%; z-index: 2; }
#foreground { background-image: url('foreground.png'); top: 60%; z-index: 3; }

/* Bouton noir */
#startBtn {
  position: fixed;
  bottom: 20px;
  left: 20px;
  padding: 10px 14px;
  background: black;
  color: white;
  border: none;
  font-size: 14px;
  cursor: pointer;
  z-index: 10;
  border-radius: 6px;
}
</style>
</head>

<body>

<button id="startBtn">Activer le gyroscope</button>

<div id="sky" class="layer"></div>
<div id="mountains" class="layer"></div>
<div id="foreground" class="layer"></div>

<script>
const sky = document.getElementById("sky");
const mountains = document.getElementById("mountains");
const foreground = document.getElementById("foreground");
const button = document.getElementById("startBtn");

let lastX = 0, lastY = 0;

function handleOrientation(event) {
  const x = event.gamma;
  const y = event.beta;

  // Lissage
  lastX += (x - lastX) * 0.1;
  lastY += (y - lastY) * 0.1;

  sky.style.transform = `translate(${lastX * 1}px, ${lastY * 1}px)`;
  mountains.style.transform = `translate(${lastX * 3}px, ${lastY * 2}px)`;
  foreground.style.transform = `translate(${lastX * 6}px, ${lastY * 4}px)`;
}

function enableGyro() {
  if (typeof DeviceOrientationEvent !== "undefined" && typeof DeviceOrientationEvent.requestPermission === "function") {
    DeviceOrientationEvent.requestPermission()
      .then(response => {
        if (response === "granted") {
          window.addEventListener("deviceorientation", handleOrientation);
          button.style.display = "none"; // cache le bouton après activation
        } else {
          alert("Permission refusée");
        }
      })
      .catch(console.error);
  } else {
    window.addEventListener("deviceorientation", handleOrientation);
    button.style.display = "none";
  }
}

button.addEventListener("click", enableGyro);
</script>

</body>
</html>
